<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BibWord</title><script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script><style>
*{box-sizing:border-box}body{font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;margin:0;background:#f7f8fb;color:#202936}.top{background:#233f70;color:white;padding:18px}.top h2{margin:0}.top p{margin:5px 0 0;color:#d9e7fa;font-size:12px}.wrap{padding:14px}.panel{background:white;border:1px solid #e2e6ee;border-radius:12px;padding:14px;margin-bottom:12px}h3{margin:0 0 10px;font-size:14px}p.hint{font-size:12px;color:#637184;line-height:1.5}button{border:0;background:#255ba6;color:white;padding:10px 12px;border-radius:8px;cursor:pointer;font-weight:600}button:disabled{opacity:.45}button.secondary{background:#edf2fb;color:#224875}textarea,input[type=text],input[type=search]{width:100%;padding:10px;border-radius:7px;border:1px solid #cdd6e5;margin:5px 0}input[type=file]{max-width:100%;font-size:12px}textarea{resize:vertical;min-height:125px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.5}.subtle{font-size:12px;color:#52627b}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}#results{max-height:280px;overflow:auto}.entry{padding:9px 0;border-bottom:1px solid #edf0f5}.entry strong{display:block;font-size:13px}.entry small{color:#718096}.entry button{margin-top:5px;padding:6px 10px}.buttons{display:flex;gap:8px;flex-wrap:wrap}#status{white-space:pre-wrap;background:#eaf5ef;color:#245e3b;padding:10px;border-radius:7px;font-size:12px}#status.error{background:#fff0f0;color:#a32929}</style></head><body>
<div class="top"><h2>📚 BibWord</h2><p>Mac Word · 本地 BibTeX 引用插件</p></div><div class="wrap">
<div class="panel"><h3>① 导入文献库</h3><label class="subtle" for="paste">直接粘贴 BibTeX（支持多篇）</label><textarea id="paste" placeholder="@article{smith2024,
  title={Example},
  author={Smith, John},
  year={2024}
}"></textarea><div class="row"><button id="pasteImport">导入粘贴内容</button><button class="secondary" id="clearPaste">清空输入框</button></div><p class="hint">或者选取本地 .bib 文件：</p><input id="file" type="file" accept=".bib,text/plain"><p class="hint">同名 citation key 再次导入时会覆盖旧记录。文献保存在当前 Word 文档中，不会上传到远程文献服务。</p><div id="count">尚未导入</div></div>
<div class="panel"><h3>② 插入引用</h3><input id="search" type="search" placeholder="搜索 cite key / 标题 / 作者"><div id="results"></div><p class="hint">点击“插入”即可在当前光标位置加入 [1]。也可在 Word 里先输入 \cite{key}，然后点击下面的替换按钮。</p><div class="buttons"><button id="replace" class="secondary">替换文中 \cite{key}</button></div></div>
<div class="panel"><h3>③ 参考文献</h3><div class="buttons"><button id="bibliography">在文末生成参考文献</button><button id="refresh" class="secondary">更新编号与文献</button></div><p class="hint">按照正文首次出现顺序编号。参考文献采用简化数字制（非严格 IEEE/GB/T CSL 排版）。</p></div>
<div id="status">打开 Word 文档后即可开始。</div></div><script src="app.js"></script></body></html>
